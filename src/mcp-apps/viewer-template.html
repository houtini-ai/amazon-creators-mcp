<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amazon Creators preview</title>
    <style>
      /*
       * Fixed-size preview window (see VIEWER_WIDTH / VIEWER_HEIGHT in
       * viewer-client.ts). Product cards can legitimately be taller than the
       * preview; we scroll inside #preview rather than letting the viewer
       * balloon the host's panel. Paste-ready HTML (content[0].text) is
       * unchanged — this sizing applies ONLY to the in-host preview.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 880px;
        height: 245px;
        overflow: hidden;
      }
      #preview {
        display: block;
        width: 880px;
        height: 245px;
        border: 0;
        background: transparent;
      }
      /* Overlaid rather than a toolbar row so the preview keeps the full slot. */
      #copy {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1;
        padding: 4px 10px;
        font: 600 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        background: #232f3e;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        opacity: 0.85;
      }
      #copy:hover,
      #copy:focus-visible {
        opacity: 1;
      }
      #copy[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- The tool's rendered HTML lives in a nested iframe (srcdoc) so its
         styles stay sandboxed away from this shell. Our <script> keeps
         running after the tool result arrives, so the App instance can
         continue reporting size changes to the host. -->
    <button id="copy" type="button" hidden title="Copy the embeddable HTML">Copy HTML</button>
    <iframe id="preview" sandbox="allow-same-origin" scrolling="auto"></iframe>
    <script type="module">
      /* __VIEWER_CLIENT__ */
    </script>
  </body>
</html>
